# Packit configuration for kwin-effects-hdr-oled-saver.
# Docs: https://packit.dev/docs/configuration
specfile_path: kwin-effects-hdr-oled-saver.spec
upstream_package_name: kwin-effects-hdr-oled-saver
# Release tags look like v0.9.0; {version} must match Version: in the spec.
upstream_tag_template: v{version}

jobs:
# Build a release in COPR whenever a GitHub release is published.
- job: copr_build
  trigger: release
  owner: deno
  project: kwin-effects-hdr-oled-saver
  targets:
  - fedora-43-x86_64
  - fedora-43-aarch64
  - fedora-44-x86_64
  - fedora-44-aarch64
  - fedora-rawhide-x86_64
  - fedora-rawhide-aarch64
