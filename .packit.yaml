# Packit configuration for kwin-panel-hdr-oled-saver-effect.
# Docs: https://packit.dev/docs/configuration
specfile_path: kwin-panel-hdr-oled-saver-effect.spec
upstream_package_name: kwin-panel-hdr-oled-saver-effect
# Release tags look like v0.9.0; {version} must match Version: in the spec.
upstream_tag_template: v{version}

jobs:
# Smoke-build every PR in COPR.
- job: copr_build
  trigger: pull_request
  owner: deno
  project: kwin-panel-hdr-oled-saver-effect
  targets:
  - fedora-43-x86_64
  - fedora-44-x86_64
  - fedora-rawhide-x86_64

# Build every push to master in COPR.
- job: copr_build
  trigger: commit
  branch: master
  owner: deno
  project: kwin-panel-hdr-oled-saver-effect
  targets:
  - fedora-43-x86_64
  - fedora-44-x86_64
  - fedora-rawhide-x86_64

# Build a release in COPR whenever a GitHub release is published.
- job: copr_build
  trigger: release
  owner: deno
  project: kwin-panel-hdr-oled-saver-effect
  targets:
  - fedora-43-x86_64
  - fedora-44-x86_64
  - fedora-rawhide-x86_64
